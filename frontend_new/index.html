<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faizers Scrabble</title>
  <!--
    Le dictionnaire (2,68 Mo bruts, 757 Ko gzip) est de loin le plus gros
    telechargement du premier affichage, et sans preload il ne demarre qu'une
    fois le bundle telecharge PUIS execute : les deux transferts s'enchainent au
    lieu de se superposer.

    Mais il ne sert qu'a l'Arene et au Codex. L'Entrainement tire desormais ses
    mots du lexique du moteur (236 Ko), et un `<link rel="preload">` ecrit en dur
    lui imposait quand meme les 757 Ko - soit trois fois le poids de tout ce dont
    la page a besoin. D'ou ce declenchement conditionnel, place avant le bundle
    pour conserver le recouvrement des deux transferts la ou il sert.

    La base du site est relue sur le lien d'icone : Vite y prefixe `base` au
    build, une chaine ecrite dans ce script ne serait pas reecrite.
  -->
  <script type="text/javascript">
    (function () {
      var route = window.location.pathname + window.location.search;
      if (/\/(training|stats)\/?(\?|$)/.test(route)) return;

      var icon = document.querySelector('link[rel="icon"]');
      var base = icon ? icon.getAttribute('href').replace(/logo\.svg$/, '') : '/';

      var link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'fetch';
      link.crossOrigin = 'anonymous';
      link.href = base + 'data/scrabble_dict.txt';
      document.head.appendChild(link);
    }());
  </script>
  <!-- GitHub Pages SPA redirect handler -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
